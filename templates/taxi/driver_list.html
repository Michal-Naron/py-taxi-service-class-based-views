{% extends 'base.html' %}
{% block content %}
  <h1>List of drivers</h1>
  {% if driver_list %}
    <ul>
    {% for driver in driver_list %}
    <li><a href="{{ driver.get_driver_url }}">{{driver.username}}</a></li>
    {% endfor %}
    </ul>
    {% else %}
    <p>There aren't any drivers</p>
  {% endif %}
{% endblock %}
